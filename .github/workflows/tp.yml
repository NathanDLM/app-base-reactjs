name: TP Github Actions
on:
  push:
    branch: main

jobs:
  install-build-test: 
    runs-on: ubuntu-latest
    steps:
      - name: recup le code
        uses: actions/checkout@v4
      - name: Installation des dépendences npm
        run: npm install
      - name: Build du projet react
        run: npm run build
      - name: demarrage du projet 
        run: npm start & 
      - name: attente du lancement du serveur
        run: npx --yes wait-on http://localhost:3000/
      - name: verification du lancement
        run: curl -I http://localhost:3000/
  

